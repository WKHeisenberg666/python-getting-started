<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Finanz-Dashboard{% endblock %}</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --danger: #f87171;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  nav {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 1rem 2rem;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
  }
  nav a.brand {
    color: var(--text);
    font-weight: 600;
    font-size: 1.1rem;
    margin-right: auto;
  }
  nav a:hover { color: var(--accent); }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem;
  }
  .messages { list-style: none; padding: 0; margin: 0 0 1.5rem; }
  .messages li {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    background: var(--panel);
    border: 1px solid var(--panel-border);
  }
  .messages li.success { border-color: var(--ok); }
  .messages li.error { border-color: var(--danger); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
  }
  .card .label { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 1.8rem; font-weight: 700; margin-top: 0.35rem; }
  .value.negative { color: var(--danger); }
  .value.positive { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 0.65rem 1rem; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 2rem 0 0.75rem; }
  .section-title h2 { margin: 0; font-size: 1.1rem; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.75rem; background: #334155; }
  .badge.open { background: #7c2d12; color: #fed7aa; }
  .badge.in_progress { background: #713f12; color: #fde68a; }
  .badge.settled { background: #14532d; color: #bbf7d0; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #0f172a;
    padding: 0.6rem 1.1rem;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  form.upload { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 1.5rem; max-width: 480px; }
  form.upload input[type=file] { display: block; margin: 1rem 0; color: var(--text); }
  .empty { color: var(--muted); padding: 1rem; }
</style>
</head>
<body>
<nav>
  <a class="brand" href="{% url 'finance:dashboard' %}">Finanz-Dashboard</a>
  <a href="{% url 'finance:dashboard' %}">Übersicht</a>
  <a href="{% url 'finance:debt_list' %}">Schulden</a>
  <a href="{% url 'finance:document_list' %}">Dokumente</a>
  <a href="{% url 'finance:upload' %}">Dokument hochladen</a>
</nav>
<main>
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
